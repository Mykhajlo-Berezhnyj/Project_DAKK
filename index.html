<!doctype html>
<html :lang="$store.locale.current" x-data="localization">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title x-text="t(indexData.titleHead)"></title>
    <meta name="description" :content="t(indexData.descriptionHead)" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body data-page="home">
    <load src="./src/partials/header.html" />
    <main>
      <section>
        <div class="video-background">
          <video autoplay muted loop playsinline>
            <source src="/videos/dakk-about-video.mp4" type="video/mp4" />
          </video>
          <div class="video-overlay"></div>
          <div
            class="content"
            x-data="{ phrases: [], current: 0, show: true, active: false, 
              cycle() {
              if (this.active) return;
              this.show = false;
              this.active = true;
              setTimeout(() => { 
                this.current = (this.current + 1) % this.phrases.length;
                 this.show = true;
                 this.active= false;
                 setTimeout(() => {
                  this.cycle();
                 }, 2500)

                }, 3500) },
             init() {
               this.updatePhrases();
              this.$watch('$store.locale.current', ()=>this.updatePhrases())
              this.cycle();
            },
             updatePhrases() {
              this.phrases = [t(indexData.phrase1), t(indexData.phrase2), t(indexData.phrase3)]
           },
            destroy() {
              this.active=false;
            } }"
            x-init="init()"
            @destroy="destroy()"
          >
            <p
              class="phrase-item"
              x-text="phrases[current]"
              x-show="show"
              x-transition.opacity.duration.2500ms
            ></p>
          </div>
        </div>
      </section>
      <load src="./src/partials/partners.html" />
    </main>
    <load src="./src/partials/footer.html" />
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
