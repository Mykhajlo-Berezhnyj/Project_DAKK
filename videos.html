<!doctype html>
<html lang="uk" :lang="$store.locale.current" x-data="localization">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title x-text="t(videosData.titleHead)">
      Відео – Перегляньте наші проєкти
    </title>
    <meta
      name="description"
      :content="t(videosData.description)"
      content="Перегляньте добірку відео з нашими архітектурними рішеннями, дизайном та ідеями майбутнього."
    />
  </head>
  <body data-page="video">
    <load src="./src/partials/header.html" />
    <main>
      <h1 class="video-main-title" x-text="t(videosData.title)">
        Ласкаво просимо до розділу «Відео»
      </h1>
      <load src="./src/partials/videoPage.html" />
    </main>
    <load src="./src/partials/footer.html" />

    <load
      x-show="$store.video.isItemOpened"
      src="./src/partials/videoModal.html"
    />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
